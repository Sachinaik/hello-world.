appId: com.timetrack.app
productName: TimeTrack
copyright: Copyright © TimeTrack

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/.vscode/*'
  - '!src/**'
  - '!tests/**'
  - '!*.map'

asarUnpack:
  - '**/*.node'

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

npmRebuild: true
